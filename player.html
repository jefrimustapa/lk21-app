<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LK-flix Cinema Player</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="style.css?v=20260821_1">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }
        .player-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
            z-index: 10;
        }
    </style>
    <script>
        (function() {
            var isNativeTV = (typeof window.AndroidBridge !== "undefined" && window.AndroidBridge.isTv && window.AndroidBridge.isTv());
            var isTVUA = /googletv|android tv|smart-tv|firetv|aftb|aftt/i.test(navigator.userAgent);
            var hasNoTouch = navigator.maxTouchPoints === 0;
            var isWide = window.innerWidth >= 900 || screen.width >= 900;
            var forceTv = new URLSearchParams(window.location.search).get("tv") === "1";
            
            if (forceTv || isNativeTV || isTVUA || isWide || hasNoTouch) {
                document.documentElement.classList.add("tv-mode");
                window._INITIAL_TV_MODE = true;
            }

            window.open = function() { return null; };
        })();
    </script>
</head>
<body class="theme-dark">
    <div class="player-page" id="playerModal">
        <!-- Top Cinematic Overlay Header -->
        <div class="player-header" id="playerHeader">
            <button class="btn-back-player" id="closePlayerBtn" tabindex="0">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
            <div class="player-meta-title">
                <div class="player-title-box">
                    <span class="player-title" id="playerTitle">Now Playing</span>
                </div>
                <div class="player-badges">
                    <span class="badge quality-badge" id="playerQuality">HD</span>
                    <span class="badge type-badge" id="playerType">MOVIE</span>
                </div>
            </div>
            <button class="btn-switch-server" id="switchServerBtn" title="Switch Stream Server" tabindex="0">
                <i class="fa-solid fa-arrows-rotate"></i> <span>Server</span>
            </button>
        </div>

        <!-- Center Screen Seek Toast / HUD Indicator -->
        <div class="player-seek-hud hidden" id="playerSeekHud">
            <i class="fa-solid fa-forward" id="seekHudIcon"></i>
            <span id="seekHudText">+10s</span>
        </div>

        <!-- Full Viewport Embedded Cinema Stream -->
        <div class="player-container">
            <video id="nativeVideoPlayer" class="hidden" controls autoplay playsinline style="width: 100%; height: 100%; object-fit: contain; background: #000;"></video>
            <iframe id="videoIframe" tabindex="-1" src="" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"></iframe>
        </div>

        <!-- TV Remote Virtual Pointer Cursor (Active only on TV before playback starts) -->
        <div id="tvVirtualCursor" class="tv-virtual-cursor hidden">
            <div class="tv-cursor-pointer"></div>
            <div class="tv-cursor-ring"></div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="stream-toast hidden" id="streamToast"></div>

    <script src="hls.min.js?v=20260819_2"></script>
    <script src="player.js?v=20260821_1"></script>
</body>
</html>
