name: Daily LK21 Scraper & Database Build

on:
  schedule:
    - cron: '0 0 * * *'  # Runs automatically every midnight UTC
  workflow_dispatch:      # Allows manual 1-click trigger from GitHub UI

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Gives permission to create GitHub Releases

    steps:
      - name: 1. Checkout Project Code
        uses: actions/checkout@v3

      - name: 2. Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run Scraper (Auto-Detect All Pages)
        run: |
          python scripts/extract_lk21_links_mv.py --max-pages 0

      - name: 5. Create GitHub Release & Upload lk21_mv_live.db
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-db
          name: "LK21 Live SQLite Database"
          body: "Latest automated SQLite database containing all scraped movies and stream URLs."
          files: |
            lk21_mv_live.db
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
