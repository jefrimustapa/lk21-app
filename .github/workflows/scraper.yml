name: Daily LK21 Scraper & Database Build - Movies

on:
  schedule:
    - cron: '0 0 * * *'  # Runs automatically every midnight UTC
  workflow_dispatch:      # Allows manual 1-click trigger from GitHub UI

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Gives permission to create GitHub Releases & push to repo
      pages: write        # Gives permission to deploy to GitHub Pages
      id-token: write

    steps:
      - name: 1. Checkout Project Code
        uses: actions/checkout@v3

      - name: 2. Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: 4. Install & Connect Cloudflare WARP (Bypass Datacenter IP Block)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode warp+doh || true
          warp-cli --accept-tos connect || true
          sleep 3

      - name: 5. Run Scraper (Across All Base URLs Until 403/404)
        run: |
          python scripts/extract_lk21_links_mv.py --all-urls

      - name: 6. Convert SQLite DB to D1 Clean SQL Dump (Non-Destructive UPSERT)
        run: |
            python scripts/export_d1_sql.py lk21_mv_live.db lk21_dump.sql

      - name: 7. Sync SQL Dump directly into Remote Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          npx wrangler d1 execute lk21_db --remote --file=lk21_dump.sql

      - name: 8. Create GitHub Release & Upload lk21_mv_live.db
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-db
          name: "LK21 Live SQLite Database"
          body: "Latest automated SQLite database containing all scraped movies and stream URLs."
          files: |
            lk21_mv_live.db
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 9. Commit & Push Updated lk21_mv_live.db to Git Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git pull origin main --rebase --autostash || true
          git add -f lk21_mv_live.db
          git commit -m "Auto-update lk21_mv_live.db [skip ci]" || echo "No changes to commit"
      - name: 10. Deploy StreamFlix Web App to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
