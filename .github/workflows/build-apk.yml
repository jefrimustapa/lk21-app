name: Build & Release Android APK (LK-flix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Manager
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install Android Build Tools 34.0.0
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Create Capacitor Project Config
        run: |
          mkdir -p dist
          cp index.html style.css app.js manifest.json dist/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.lkflix.app",
            "appName": "LKflix",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android
          npx cap copy android

      - name: Build Release APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK File
        run: |
          cd android/app/build/outputs/apk/release
          keytool -genkeypair -dname "cn=LK-flix, ou=Media, o=LKflix, c=US" -alias android -keypass password -keystore android.keystore -storepass password -keyalg RSA -keysize 2048 -validity 10000
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks android.keystore --ks-key-alias android --ks-pass pass:password --key-pass pass:password app-release-unsigned.apk
          mv app-release-unsigned.apk LK-flix-Android.apk

      - name: Release APK on GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-apk
          name: "LK-flix Android APK Install File"
          body: "Direct Android APK package installer for LK-flix."
          files: android/app/build/outputs/apk/release/LK-flix-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
